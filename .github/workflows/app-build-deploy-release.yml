name: App Build & Deploy Release

# Reusable release pipeline, driven by the caller's `release` events:
#   prereleased → mainnet build (bundle attached to the release) → staging
#                 (`versions upload --preview-alias staging`, tagged with the
#                 release tag)
#               → for callers whose wrangler.toml declares `[env.demo]`, a
#                 parallel testnet-mode build (own bundle) deployed to that
#                 Worker (`deploy --env demo`)
#   released    → notify Slack that the staged version is ready; an
#                 authorized deployer promotes it by dispatching the app's
#                 promote-production.yml caller (app-promote-production.yml)
#
# Production promotion is deliberately NOT automated on the release event.
# Promotion goes through the allowlist-gated dispatch workflow
# (app-promote-production.yml): actor must be in the caller repo's
# AUTHORIZED_DEPLOYERS variable, dispatched from main, audited as a workflow
# run, failed attempts announced to Slack. That is a process control, not a
# hard control: anyone holding a token that can deploy Worker versions can
# still promote, and repo admins can edit the allowlist. It removes the
# automatic, unattended path and ties promotion to a GitHub identity — it
# does not remove the capability.
#
# A tag MUST be prereleased before it can be released: promotion targets the
# version staging uploaded, and the bundle only exists after the prerelease
# build.
#
# Release bundles are immutable: re-running the prerelease build for a tag
# whose bundle already exists fails. Cut a new prerelease for new code, or
# delete the asset from the release page to rebuild the same tag.
#
# GitHub Environments (`staging`, `demo`) resolve against the caller's repo.
# Caller permissions ceiling: contents: write (release bundle upload),
# deployments: write (deployment records). The released path only reads and
# posts to Slack, so it needs no extra scopes.

on:
  workflow_call:
    inputs:
      app-name:
        description: 'Prefix for run-scoped build artifact names'
        required: true
        type: string
      bundle-name-prefix:
        description: 'Prefix for the release bundle zip name; defaults to app-name'
        required: false
        type: string
        default: ''
      node-version:
        description: 'Node.js version to use'
        required: true
        type: string
      build-args:
        description: 'Extra arguments passed to `pnpm build`'
        required: false
        type: string
        default: '--mode mainnet'
      build-env:
        description: 'Multiline KEY=VALUE pairs exported to the build step environment'
        required: false
        type: string
        default: ''
      pool-cache-base-url:
        description: 'Optional account-specific pool-cache Worker base URL'
        required: false
        type: string
        default: ''
      cloudflare-account-id:
        description: 'Cloudflare account ID (a repository variable, not a secret)'
        required: true
        type: string
      demo-build-args:
        description: 'Extra arguments passed to `pnpm build` for the demo build'
        required: false
        type: string
        default: '--mode testnet'
      demo-build-env:
        description: 'Multiline KEY=VALUE pairs exported to the demo build step environment'
        required: false
        type: string
        default: ''
      production-url:
        description: 'Public production URL, surfaced in the promotion notification'
        required: false
        type: string
        default: ''
      production-worker-name:
        description: 'Cloudflare Worker name for the prod environment (wrangler.toml [env.prod]); used in the promotion notification commands and dashboard link'
        required: false
        type: string
        default: ''
    secrets:
      cloudflare-api-token:
        description: 'Cloudflare API token'
        required: true
      slack-webhook-url:
        description: 'Slack incoming-webhook URL for the production-promotion notification'
        required: true
    outputs:
      staging-url:
        description: 'Staging deployment URL (prereleased only)'
        value: ${{ jobs.deploy-staging.outputs.deployment-url }}
      demo-url:
        description: 'Demo deployment URL (prereleased, when the caller declares [env.demo])'
        value: ${{ jobs.deploy-demo.outputs.deployment-url }}

jobs:
  # One build per release, shared via `needs: build`. Artifact names are
  # immutable per run — never add a second build job for the same app-name on
  # the same trigger.
  build:
    runs-on: ubuntu-latest
    if: github.event.action == 'prereleased'
    environment: staging
    permissions:
      # gh release upload of the built bundle
      contents: write
    steps:
      - name: '📥 Checkout Code from Release Tag'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # build-app receives the token explicitly; keep it out of .git/config
          persist-credentials: false

      - name: '🔨 Build App'
        id: build
        uses: centrifuge/github-actions-lib/actions/build-app@main
        with:
          app-name: ${{ inputs.app-name }}
          bundle-name-prefix: ${{ inputs.bundle-name-prefix }}
          node-version: ${{ inputs.node-version }}
          build-args: ${{ inputs.build-args }}
          build-env: ${{ inputs.build-env }}
          pool-cache-base-url: ${{ inputs.pool-cache-base-url }}
          github-token: ${{ github.token }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.event.action == 'prereleased'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      # wrangler-action records a GitHub deployment for the environment URL
      deployments: write
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: '📥 Checkout Code'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: '🚀 Deploy App to Staging'
        id: deploy
        uses: centrifuge/github-actions-lib/actions/deploy-app@main
        with:
          environment: staging
          app-name: ${{ inputs.app-name }}
          cloudflare-api-token: ${{ secrets.cloudflare-api-token }}
          cloudflare-account-id: ${{ inputs.cloudflare-account-id }}
          github-token: ${{ github.token }}

  # An `[env.demo]` section in the caller's wrangler.toml is the opt-in,
  # and its custom-domain route is the public URL. Parsed with tomllib rather
  # than grep so comments, key order and quoting can't change the answer.
  detect-demo:
    runs-on: ubuntu-latest
    if: github.event.action == 'prereleased'
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
      url: ${{ steps.detect.outputs.url }}
    steps:
      - name: '📥 Checkout Code from Release Tag'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: '🔎 Detect [env.demo] in wrangler.toml'
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import pathlib, sys, tomllib

          path = pathlib.Path("wrangler.toml")
          enabled, url = False, ""

          if path.is_file():
              try:
                  with path.open("rb") as handle:
                      config = tomllib.load(handle)
              except tomllib.TOMLDecodeError as exc:
                  # Fail loudly: silently skipping the demo leg would look
                  # like the app simply opted out.
                  print(f"::error::wrangler.toml is not valid TOML: {exc}", file=sys.stderr)
                  raise SystemExit(1)

              demo = (config.get("env") or {}).get("demo")
              if demo is not None:
                  enabled = True
                  for route in demo.get("routes") or []:
                      if isinstance(route, dict) and route.get("custom_domain") and route.get("pattern"):
                          url = f"https://{route['pattern']}"
                          break

          print(f"enabled={'true' if enabled else 'false'}")
          print(f"url={url}")
          PY

      - name: '📋 Summary'
        shell: bash
        env:
          ENABLED: ${{ steps.detect.outputs.enabled }}
          URL: ${{ steps.detect.outputs.url }}
        run: |
          if [ "$ENABLED" = "true" ]; then
            echo "Demo deploy enabled by wrangler.toml [env.demo]${URL:+ → $URL}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No [env.demo] in wrangler.toml — skipping the demo leg." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Artifact and bundle names are suffixed because artifact names are
  # immutable per run — colliding with the mainnet build would make one
  # overwrite the other.
  build-demo:
    runs-on: ubuntu-latest
    needs: detect-demo
    if: github.event.action == 'prereleased' && needs.detect-demo.outputs.enabled == 'true'
    # As on `build`: a protection rule on the environment gates the build too.
    environment: demo
    permissions:
      # gh release upload of the built demo bundle
      contents: write
    steps:
      - name: '📥 Checkout Code from Release Tag'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: '🔨 Build App (demo, testnet mode)'
        id: build
        uses: centrifuge/github-actions-lib/actions/build-app@main
        with:
          app-name: ${{ inputs.app-name }}-demo
          bundle-name-prefix: ${{ format('{0}-demo', inputs.bundle-name-prefix || inputs.app-name) }}
          node-version: ${{ inputs.node-version }}
          build-args: ${{ inputs.demo-build-args }}
          build-env: ${{ inputs.demo-build-env }}
          # No pool-cache-base-url: there is no testnet pool-cache Worker;
          # these builds fall back to the repo's prebuilt snapshot.
          github-token: ${{ github.token }}

  deploy-demo:
    runs-on: ubuntu-latest
    needs: [detect-demo, build-demo]
    if: github.event.action == 'prereleased' && needs.detect-demo.outputs.enabled == 'true'
    environment:
      name: demo
      url: ${{ needs.detect-demo.outputs.url || steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      # wrangler-action records a GitHub deployment for the environment URL
      deployments: write
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: '📥 Checkout Code'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: '🚀 Deploy App to Demo'
        id: deploy
        uses: centrifuge/github-actions-lib/actions/deploy-app@main
        with:
          environment: demo
          app-name: ${{ inputs.app-name }}-demo
          cloudflare-api-token: ${{ secrets.cloudflare-api-token }}
          cloudflare-account-id: ${{ inputs.cloudflare-account-id }}
          github-token: ${{ github.token }}

  # `released` does not deploy — it announces that the version staged for
  # this tag is ready and posts the gated promotion instructions. The link
  # assumes the caller repo names its promote caller `promote-production.yml`
  # (documented in the README). No Cloudflare token, no wrangler, no
  # artifact; needs only network access to post Slack.
  notify-production-promotion:
    runs-on: ubuntu-latest
    if: github.event.action == 'released'
    permissions:
      contents: read
    steps:
      - name: '📣 Request production promotion'
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
          APP_NAME: ${{ inputs.app-name }}
          WORKER_NAME: ${{ inputs.production-worker-name }}
          ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
          PRODUCTION_URL: ${{ inputs.production-url }}
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Fall back to a readable placeholder so the message is still
          # coherent if a caller omits the worker name.
          WORKER="${WORKER_NAME:-<worker from wrangler.toml [env.prod]>}"
          RELEASE_URL="${SERVER_URL}/${REPOSITORY}/releases/tag/${TAG}"
          PROMOTE_URL="${SERVER_URL}/${REPOSITORY}/actions/workflows/promote-production.yml"
          DASH_URL="https://dash.cloudflare.com/${ACCOUNT_ID}/workers/services/view/${WORKER}/production/deployments"
          # No -f tag=...: the promote workflow takes no inputs, it resolves
          # GitHub's latest release itself. Passing one is rejected by gh.
          GH_COMMAND="gh workflow run promote-production.yml --repo ${REPOSITORY} --ref main"

          # printf per line keeps the message free of YAML/heredoc indentation.
          TEXT=$(printf '%s\n' \
            "🚀 *${APP_NAME}* — release *${TAG}* is staged, not receiving production traffic yet." \
            "Staging already serves this version. Promotion is gated: a deployer listed in AUTHORIZED_DEPLOYERS must dispatch the promote workflow from main. It promotes whatever GitHub reports as the latest release, so release *${TAG}* before promoting." \
            "" \
            "• Release: <${RELEASE_URL}|${TAG}> — by ${ACTOR}" \
            "" \
            "*To promote:*" \
            '```' \
            "${GH_COMMAND}" \
            '```' \
            "Or via <${PROMOTE_URL}|Promote Production> → Run workflow." \
            "Emergency fallback: a Cloudflare admin can promote from the <${DASH_URL}|dashboard>.")
          if [ -n "$PRODUCTION_URL" ]; then
            TEXT="${TEXT}"$'\n'"Once promoted, live at ${PRODUCTION_URL}"
          fi

          PAYLOAD=$(jq -n --arg text "$TEXT" '{text: $text}')
          HTTP_CODE=$(curl -sS -o /tmp/slack_resp.txt -w '%{http_code}' \
            -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK_URL")
          echo "Slack responded: ${HTTP_CODE} $(cat /tmp/slack_resp.txt)"

          # Fail loudly: a swallowed notification means nobody promotes.
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Slack notification failed (HTTP ${HTTP_CODE}). Promote via: ${GH_COMMAND}"
            exit 1
          fi

          {
            echo "### 🚀 Production promotion required"
            echo "Release [\`${TAG}\`](${RELEASE_URL}) is staged. An authorized deployer must promote it:"
            echo ""
            echo "\`\`\`${GH_COMMAND}\`\`\`"
            echo ""
            echo "Or dispatch [Promote Production](${PROMOTE_URL})."
          } >> "$GITHUB_STEP_SUMMARY"
