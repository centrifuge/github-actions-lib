name: App Rollback

# Reusable manual rollback (call from a workflow_dispatch caller):
#   prod    → traffic shift to the version tagged with the release tag
#             (`versions deploy <id>@100%`, no rebuild)
#   staging → download the release bundle and re-point the staging preview
#             alias (`versions upload --preview-alias staging`)
#   demo    → download the demo release bundle
#             (`<bundle-prefix>-demo-bundle<tag>.zip`) and redeploy the
#             standalone demo Worker (`deploy --env demo`)
#
# NOTE: the prod path runs the same `versions deploy @100%` command as
# gated promotion (app-promote-production.yml). It is the emergency
# traffic-shift path and keeps that capability on purpose — but it is gated
# by the same AUTHORIZED_DEPLOYERS allowlist (fail-closed when empty), so an
# ordinary write user can no longer shift production traffic by dispatching
# a rollback. `authorized-deployers` is declared optional only so existing
# callers keep parsing during rollout; at runtime an empty value refuses to
# roll back — callers must pass their AUTHORIZED_DEPLOYERS variable.
#
# The gate applies to every environment, not just prod — demo and staging
# rollbacks need an authorized deployer too.

# Pipeline-only pin, not caller-overridable — see README "Pinned
# pipeline-only tool versions". Keep in sync with actions/deploy-app's
# wrangler-version default; both are hardcoded, not linked mechanically.
env:
  WRANGLER_VERSION: '4.111.0'

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to roll back to (e.g., v1.2.0)'
        required: true
        type: string
      environment:
        description: "Environment to roll back ('staging', 'demo' or 'prod')"
        required: false
        type: string
        default: 'prod'
      app-name:
        description: 'App name (used in log output)'
        required: true
        type: string
      bundle-name-prefix:
        description: 'Prefix of the release bundle zip name; defaults to app-name'
        required: false
        type: string
        default: ''
      cloudflare-account-id:
        description: 'Cloudflare account ID (a repository variable, not a secret)'
        required: true
        type: string
      authorized-deployers:
        description: 'Comma-separated GitHub usernames allowed to roll back; empty fails closed at runtime. Pass the caller repo AUTHORIZED_DEPLOYERS variable. (Optional only for parse-compat during rollout.)'
        required: false
        type: string
        default: ''
    secrets:
      cloudflare-api-token:
        description: 'Cloudflare API token'
        required: true
      slack-webhook-url:
        description: 'Slack incoming-webhook URL for failed-attempt alerts (optional; skipped when absent)'
        required: false

jobs:
  authorize:
    name: Authorize deployer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify dispatched from main
        id: check-ref
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Rollback must be dispatched using the workflow from main (got ref: $GITHUB_REF). The workflow YAML on main is the trust root."
            exit 1
          fi

      - name: Check deployer authorization
        id: check-perm
        shell: bash
        env:
          AUTHORIZED_DEPLOYERS: ${{ inputs.authorized-deployers }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "${AUTHORIZED_DEPLOYERS}" ]; then
            echo "::error::authorized-deployers is empty; rollback fails closed. Set the AUTHORIZED_DEPLOYERS repository variable and pass it from the caller."
            exit 1
          fi

          if printf ',%s,' "${AUTHORIZED_DEPLOYERS// /}" | grep -Fqi ",${ACTOR},"; then
            echo "${ACTOR} is in AUTHORIZED_DEPLOYERS."
            exit 0
          fi

          echo "::error::${ACTOR} is not listed in AUTHORIZED_DEPLOYERS."
          exit 1

      - name: Notify failed attempt
        if: failure()
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
          APP_NAME: ${{ inputs.app-name }}
          TAG: ${{ inputs.tag }}
          TARGET_ENV: ${{ inputs.environment }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            exit 0
          fi
          if [ "${{ steps.check-ref.outcome }}" = "failure" ]; then
            REASON="not dispatched from main"
          elif [ "${{ steps.check-perm.outcome }}" = "failure" ]; then
            REASON="${ACTOR} is not authorized"
          else
            REASON="authorization check failed"
          fi
          TEXT="⚠️ *${APP_NAME}* — an attempt to roll back ${TARGET_ENV} to \`${TAG}\` failed: ${REASON}."
          PAYLOAD=$(jq -n --arg text "$TEXT" '{text: $text}')
          curl -sS -o /dev/null -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || true

  rollback:
    name: 'Roll Back ${{ inputs.app-name }} to ${{ inputs.tag }} on ${{ inputs.environment }}'
    needs: authorize
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment == 'prod' && 'production' || inputs.environment }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: '📥 Checkout Code from Release Tag'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: '🟢 Setup Node.js'
        # Must satisfy WRANGLER_VERSION's own minimum (wrangler 4.x requires
        # Node >=22) — unrelated to the app's own toolchain.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: '📦 Install Wrangler'
        shell: sh
        run: npm install -g "wrangler@$WRANGLER_VERSION"

      - name: '📦 Download Release Bundle'
        if: inputs.environment != 'prod'
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          BUNDLE_PREFIX: ${{ inputs.bundle-name-prefix || inputs.app-name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Demo bundles are attached under their own suffixed prefix
          if [ "$INPUT_ENVIRONMENT" = "demo" ]; then
            BUNDLE_PREFIX="${BUNDLE_PREFIX}-demo"
          fi
          BUNDLE_NAME="${BUNDLE_PREFIX}-bundle${TAG}.zip"
          gh release download "$TAG" \
            --repo "$GH_REPOSITORY" \
            --pattern "$BUNDLE_NAME"
          rm -rf dist
          unzip "$BUNDLE_NAME" -d dist

      - name: '⚙️ Determine wrangler command'
        id: wrangler-command
        shell: sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$INPUT_ENVIRONMENT" = "prod" ]; then
            WORKER_NAME=$(grep -A1 "\[env.prod\]" wrangler.toml | grep "name" | cut -d'"' -f2)
            VERSION_ID=$(wrangler versions list --name "$WORKER_NAME" --env prod --json | jq -r ".[] | select(.annotations.\"workers/tag\" == \"$TAG\") | .id" | head -1)
            if [ -z "$VERSION_ID" ] || [ "$VERSION_ID" = "null" ]; then
              echo "::error::No Cloudflare version found for tag $TAG"
              echo "Available tags:"
              wrangler versions list --name "$WORKER_NAME" --env prod --json | jq -r ".[].annotations.\"workers/tag\""
              exit 1
            fi
            CMD="versions deploy $VERSION_ID@100% --env prod --yes"
          elif [ "$INPUT_ENVIRONMENT" = "staging" ]; then
            CMD="versions upload --env prod --message \"Rollback to $TAG\" --preview-alias staging"
          elif [ "$INPUT_ENVIRONMENT" = "demo" ]; then
            CMD="deploy --env demo"
          else
            echo "::error::Environment '$INPUT_ENVIRONMENT' is not supported (use 'staging', 'demo' or 'prod')."
            exit 1
          fi
          echo "Wrangler command: $CMD"
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"

      - name: '🚀 Deploy to Cloudflare'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.cloudflare-api-token }}
          accountId: ${{ inputs.cloudflare-account-id }}
          gitHubToken: ${{ github.token }}
          command: ${{ steps.wrangler-command.outputs.cmd }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
        id: deploy
