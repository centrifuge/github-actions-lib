name: App Build & Deploy Dev

# Reusable test-environment pipeline:
#   pull_request → build (testnet) → deploy to `preview` (wrangler env `dev`) → Lighthouse
#   push to main → build (testnet) → deploy to `demo` (wrangler env `dev`, direct deploy)
#
# GitHub Environments resolve against the caller's repo, so protection rules
# stay per-app.

on:
  workflow_call:
    inputs:
      app-name:
        description: 'Prefix for run-scoped build artifact names'
        required: true
        type: string
      node-version:
        description: 'Node.js version to use'
        required: true
        type: string
      build-args:
        description: 'Extra arguments passed to `pnpm build`'
        required: false
        type: string
        default: '--mode testnet'
      build-env:
        description: 'Multiline KEY=VALUE pairs exported to the build step environment'
        required: false
        type: string
        default: ''
      cloudflare-account-id:
        description: 'Cloudflare account ID (a repository variable, not a secret)'
        required: true
        type: string
      run-lighthouse:
        description: 'Whether to run the Lighthouse performance check on PR previews'
        required: false
        type: boolean
        default: true
      lighthouse-config:
        description: 'Path to an LHCI config file in the caller repo; empty uses the library''s shared config'
        required: false
        type: string
        default: ''
    secrets:
      cloudflare-api-token:
        description: 'Cloudflare API token'
        required: true
    outputs:
      deployment-url:
        description: 'URL of the deployed application'
        value: ${{ jobs.deploy.outputs.deployment-url }}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: '📥 Checkout Code'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: '🔨 Build App'
        id: build
        uses: centrifuge/github-actions-lib/actions/build-app@main
        with:
          app-name: ${{ inputs.app-name }}
          node-version: ${{ inputs.node-version }}
          build-args: ${{ inputs.build-args }}
          build-env: ${{ inputs.build-env }}

  deploy:
    needs: build
    permissions:
      contents: read
      deployments: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'demo' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: '📥 Checkout Code'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: '🚀 Deploy App'
        id: deploy
        uses: centrifuge/github-actions-lib/actions/deploy-app@main
        with:
          environment: ${{ github.event_name == 'pull_request' && 'dev' || 'demo' }}
          app-name: ${{ inputs.app-name }}
          cloudflare-api-token: ${{ secrets.cloudflare-api-token }}
          cloudflare-account-id: ${{ inputs.cloudflare-account-id }}
          github-token: ${{ github.token }}

  performance-score:
    needs: deploy
    if: ${{ inputs.run-lighthouse && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      statuses: write
      checks: write
    steps:
      - name: '📥 Checkout Code'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Plain file checkout of this library for the shared LHCI config — a
      # `uses: ./` reference cannot resolve a runtime path.
      - name: '📥 Fetch Shared Lighthouse Config'
        if: ${{ inputs.lighthouse-config == '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: centrifuge/github-actions-lib
          ref: main
          path: .lib
          persist-credentials: false

      - name: '📊 Performance Test with Lighthouse'
        env:
          LHCI_GITHUB_TOKEN: ${{ github.token }}
          LHCI_CONFIG: ${{ inputs.lighthouse-config }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment-url }}
        run: |
          # deploy-app yields an empty deployment-url when Cloudflare returns
          # no preview URL (Preview URLs disabled for the Worker) — it warns
          # and carries on. Passing that empty value to lhci is worse than
          # skipping: with no --collect.url it falls back to hunting for a
          # static dist dir and fails with a misleading "could not determine
          # staticDistDir" error. Skip instead — this config's assertions are
          # all `off` (reports are informational), so a missing preview URL
          # must never fail a PR.
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::warning::No preview URL from the deploy job — skipping Lighthouse. Enable Preview URLs for this Worker in Cloudflare to get performance reports on PRs."
            exit 0
          fi
          CONFIG="$LHCI_CONFIG"
          [ -z "$CONFIG" ] && CONFIG=".lib/lighthouserc.json"
          npm install -g @lhci/cli

          # Tee so the hosted report link can be lifted out of the output;
          # pipefail keeps a genuine lhci failure from being masked by tee.
          set -o pipefail
          lhci autorun --config="$CONFIG" --collect.url="$DEPLOYMENT_URL" 2>&1 | tee /tmp/lhci.log

          # The shared config uploads to LHCI's temporary public storage and
          # prints "Open the report at <url>". Surface that on the run summary
          # so nobody has to expand job logs to find it. Reports are NOT kept
          # as artifacts and that bucket expires them after a few days, so the
          # link is only good for a short while.
          REPORT_URL=$(grep -oE 'https://storage\.googleapis\.com/[^[:space:]]+\.report\.html' /tmp/lhci.log | head -1)
          {
            echo "### 📊 Lighthouse"
            echo ""
            echo "Tested: ${DEPLOYMENT_URL}"
            if [ -n "$REPORT_URL" ]; then
              echo ""
              echo "[Open the report](${REPORT_URL}) — hosted on LHCI temporary public storage, expires after a few days."
            else
              echo ""
              echo "No hosted report link found in the lhci output (upload target may not be temporary-public-storage)."
            fi
            echo ""
            echo "_All assertions are \`off\` in the shared config, so this check is informational and cannot fail a PR._"
          } >> "$GITHUB_STEP_SUMMARY"
