name: Lib CI

# This library is the trusted root of the app pipelines (consumers reference
# it @main), so its own CI must stay strict: workflow schema validation,
# SHA-pinning enforcement, and YAML lint on every change.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color

  pinned-actions-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify all GitHub Actions are SHA-pinned
        uses: suzuki-shunsuke/pinact-action@cf51507d80d4d6522a07348e3d58790290eaf0b6 # v2.0.0
        with:
          skip_push: 'true'

      # pinact skips first-party refs (they carry a `# lib-pin` marker, not a
      # version), so enforce the full-SHA form for them here.
      - name: Verify first-party refs are full-SHA pinned
        run: |
          bad=$(grep -rnE --exclude=lib-ci.yml 'centrifuge/github-actions-lib/[^[:space:]]*@' .github actions | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          badref=$(grep -rn -A2 --exclude=lib-ci.yml 'repository: centrifuge/github-actions-lib' .github actions | grep -E 'ref:' | grep -vE 'ref:[[:space:]]+[0-9a-f]{40}([[:space:]]|$)' || true)
          bad="$bad$badref"
          if [ -n "$bad" ]; then
            echo "::error::First-party refs must be full commit SHAs:"
            echo "$bad"
            exit 1
          fi

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run yamllint
        run: |
          pip install --user yamllint==1.35.1
          ~/.local/bin/yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .github actions
