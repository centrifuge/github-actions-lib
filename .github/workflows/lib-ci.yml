name: Lib CI

# This library is the trusted root of the app pipelines (consumers reference
# it @main), so its own CI must stay strict: workflow schema validation,
# SHA-pinning enforcement, and YAML lint on every change.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color

  pinned-actions-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify all GitHub Actions are SHA-pinned
        uses: suzuki-shunsuke/pinact-action@cf51507d80d4d6522a07348e3d58790290eaf0b6 # v2.0.0
        with:
          skip_push: 'true'

      # pinact skips first-party refs (they carry a `# lib-pin` marker, not a
      # version), so enforce the full-SHA form for them here. Parsed as YAML
      # rather than grepped, and it covers this file too.
      - name: Verify first-party refs are full-SHA pinned
        run: |
          cat > "$RUNNER_TEMP/requirements.txt" <<'REQ'
          pyyaml==6.0.2 --hash=sha256:ec031d5d2feb36d1d1a24380e4db6d43695f3748343d99434e6f5f9156aaa2ed --hash=sha256:3ad2a3decf9aaba3d29c8f537ac4b243e36bef957511b4766cb0057d32b0be85 --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476 --hash=sha256:70b189594dbe54f75ab3a1acec5f1e3faa7e8cf2f1e08d9b561cb41b845f69d5
          REQ
          pip install --user --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/requirements.txt"
          python3 - <<'PY'
          import glob, re, sys, yaml
          LIB = 'centrifuge/github-actions-lib'
          SHA = re.compile(r'[0-9a-f]{40}')
          # Static check only: a ref or repository set through a GitHub expression
          # is not resolved, so it fails the SHA test and must be spelled out.
          bad = []

          def check_uses(where, uses):
              if isinstance(uses, str) and uses.lower().lstrip('./').startswith(LIB):
                  ref = uses.rsplit('@', 1)[1] if '@' in uses else ''
                  if not SHA.fullmatch(ref):
                      bad.append(f'{where}: {uses}')

          def walk(where, node):
              if isinstance(node, dict):
                  check_uses(where, node.get('uses'))
                  w = node.get('with')
                  if isinstance(w, dict) and str(w.get('repository', '')).strip().lower() == LIB:
                      if not SHA.fullmatch(str(w.get('ref', ''))):
                          bad.append(f"{where}: checkout of {LIB} with ref {w.get('ref')!r}")
                  for v in node.values():
                      walk(where, v)
              elif isinstance(node, list):
                  for v in node:
                      walk(where, v)

          for path in glob.glob('.github/**/*.y*ml', recursive=True) + glob.glob('actions/**/*.y*ml', recursive=True):
              with open(path) as fh:
                  walk(path, yaml.safe_load(fh))
          if bad:
              print('::error::First-party refs must be full commit SHAs:')
              print('\n'.join(bad))
              sys.exit(1)
          PY

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run yamllint
        run: |
          pip install --user yamllint==1.35.1
          ~/.local/bin/yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .github actions
