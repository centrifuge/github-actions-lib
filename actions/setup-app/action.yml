name: 'Setup App Toolchain'
description: >-
  Node.js + pnpm bootstrap shared by all app pipelines. pnpm is resolved from
  the app's package.json "packageManager" field, so the pnpm version is owned
  by each app repo, not by this library.

inputs:
  node-version:
    description: 'Node.js version to use'
    required: true
  cache:
    description: "setup-node cache option ('pnpm' or '' to disable)"
    required: false
    default: 'pnpm'

outputs:
  github-packages:
    description: >-
      'true' when the app's .npmrc routes a scope to npm.pkg.github.com. The
      caller's install step must then set NODE_AUTH_TOKEN to github.token.
    value: ${{ steps.github-packages.outputs.enabled }}

runs:
  using: 'composite'
  steps:
    - name: '📦 Setup pnpm'
      uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
      # No `version:` on purpose — resolved from package.json "packageManager".

    - name: '🟢 Setup Node.js'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}

    # The app opts in by routing a scope in its own .npmrc; nothing changes for
    # apps that do not. Only the placeholder is written, so the token lives in
    # the install step's environment and never on disk.
    - name: '🔑 GitHub Packages Auth (if the app uses it)'
      id: github-packages
      shell: sh
      run: |
        if [ -f .npmrc ] && grep -Eq '^[[:space:]]*(@[^:]+:)?registry[[:space:]]*=[[:space:]]*https://npm\.pkg\.github\.com(/|[[:space:]]|$)' .npmrc; then
          # Single quotes on purpose: npm expands the variable when it reads the file.
          # shellcheck disable=SC2016
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        fi
