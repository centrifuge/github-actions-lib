name: 'Require a linked issue'
description: >-
  Fails a pull request that has no linked issue (IT compliance control: every
  change traces back to an issue). Pull requests by the logins in
  `exempt-authors` (default: `dependabot[bot]`) are exempt.

# Asks GitHub for the PR's `closingIssuesReferences`, the same list that drives
# the Development sidebar. A closing keyword in the PR body (`Closes #123`) and
# an issue linked in the sidebar both land in it. Third-party actions that
# parse the body text miss the sidebar.
#
# Linking in the sidebar fires no webhook, so a PR that failed this check does
# not turn green on its own: re-run the check after linking.
#
# The calling job needs `pull-requests: read` (and `contents: read`). No
# checkout is needed. Call it from a `pull_request` workflow.

inputs:
  github-token:
    description: 'Token used to read the pull request (needs pull-requests: read)'
    required: false
    default: ${{ github.token }}
  exempt-authors:
    description: >-
      Comma-separated pull request author logins that pass without a linked
      issue, as they appear in the event payload (bots end in `[bot]`).
      Case-insensitive. Replaces the default when set.
    required: false
    default: 'dependabot[bot]'

runs:
  using: 'composite'
  steps:
    - name: '🔗 Require a linked issue'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        EXEMPT_AUTHORS: ${{ inputs.exempt-authors }}
      run: |
        # Bots such as Dependabot cannot link an issue; the caller lists which logins pass.
        IFS=',' read -ra exempt <<< "$EXEMPT_AUTHORS"
        for login in "${exempt[@]}"; do
          # trim surrounding spaces so "a, b" matches
          login="${login#"${login%%[![:space:]]*}"}"
          login="${login%"${login##*[![:space:]]}"}"
          if [ -n "$login" ] && [ "${PR_AUTHOR,,}" = "${login,,}" ]; then
            echo "Exempt author: ${PR_AUTHOR}."
            exit 0
          fi
        done

        owner="${REPO%%/*}"
        name="${REPO##*/}"
        count=$(gh api graphql \
          -f query='query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                closingIssuesReferences(first: 1) { totalCount }
              }
            }
          }' \
          -f owner="$owner" -f name="$name" -F number="$PR_NUMBER" \
          --jq '.data.repository.pullRequest.closingIssuesReferences.totalCount')

        if [ "$count" -gt 0 ]; then
          echo "PR #${PR_NUMBER} links ${count}+ issue(s)."
          exit 0
        fi

        echo "::error title=No linked issue::Link an issue in the Development sidebar or add 'Closes #<issue>' to the PR description, then re-run this check."
        exit 1
