name: 'Build App'
description: >-
  Build a Vite app with the shared toolchain and publish its artifacts.
  Uploads the build as `<app-name>-build-<sha>` for same-run deploy jobs, and
  on prerelease events attaches `<bundle-name-prefix>-bundle<tag>.zip` to the
  GitHub release.

inputs:
  app-name:
    description: 'Prefix for run-scoped build artifact names (e.g. invest-v3, launchpad)'
    required: true
  bundle-name-prefix:
    description: 'Prefix for the release bundle zip name; defaults to app-name'
    required: false
    default: ''
  node-version:
    description: 'Node.js version to use'
    required: true
  build-args:
    description: 'Extra arguments passed to `pnpm build` (e.g. --mode testnet)'
    required: false
    default: ''
  build-env:
    description: 'Multiline KEY=VALUE pairs exported to the build step environment'
    required: false
    default: ''
  pool-cache-base-url:
    description: 'Optional account-specific pool-cache Worker base URL (exported as VITE_POOL_CACHE_BASE_URL)'
    required: false
    default: ''
  github-token:
    description: 'GitHub token (required on release events for gh release view/upload)'
    required: false
    default: ''
  attest:
    description: >-
      'true' to sign a build provenance attestation for the release bundle
      (prereleased events only). The calling job must grant `id-token: write`
      and `attestations: write`, and the repository must support artifact
      attestations (public repos, or private on GitHub Enterprise Cloud).
    required: false
    default: 'false'

outputs:
  artifact-name:
    description: 'Name of the uploaded run-scoped build artifact'
    value: ${{ inputs.app-name }}-build-${{ github.sha }}
  bundle-name:
    description: 'Name of the release bundle zip (release events only)'
    value: ${{ steps.check-artifact.outputs.artifact-name }}

runs:
  using: 'composite'
  steps:
    - name: '🧰 Setup Toolchain'
      id: setup
      uses: centrifuge/github-actions-lib/actions/setup-app@ea072316a2d5e69a325a91f8f5c7233ff5cb6ae0 # lib-pin
      with:
        node-version: ${{ inputs.node-version }}

    - name: '🔍 Refuse to Overwrite an Existing Release Bundle'
      # Release bundles are immutable: rebuilding under the same tag would
      # silently change what a later `released` promotion or rollback deploys.
      if: github.event.action == 'prereleased'
      id: check-artifact
      shell: sh
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REF_NAME: ${{ github.ref_name }}
        GH_REPOSITORY: ${{ github.repository }}
        BUNDLE_PREFIX: ${{ inputs.bundle-name-prefix || inputs.app-name }}
      run: |
        ARTIFACT_NAME="${BUNDLE_PREFIX}-bundle${GH_REF_NAME}.zip"
        echo "artifact-name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
        if [ -n "$(gh release view "$GH_REF_NAME" --repo "$GH_REPOSITORY" --json assets --jq '.assets[] | select(.name == "'"$ARTIFACT_NAME"'")')" ]; then
          echo "::error::$ARTIFACT_NAME is already attached to release $GH_REF_NAME. For new code, create a new prerelease. To rebuild this tag anyway, delete the asset at $GITHUB_SERVER_URL/$GH_REPOSITORY/releases/tag/$GH_REF_NAME and re-run."
          exit 1
        fi

    - name: '📥 Install Dependencies'
      shell: sh
      env:
        # Empty unless the app routes a scope to GitHub Packages (setup-app).
        NODE_AUTH_TOKEN: ${{ steps.setup.outputs.github-packages == 'true' && github.token || '' }}
      run: pnpm install --frozen-lockfile

    - name: '🎨 Generate Chakra UI Types'
      shell: sh
      run: pnpm theme:typings

    - name: '🌱 Apply Build Environment'
      if: ${{ inputs.build-env != '' }}
      shell: sh
      env:
        BUILD_ENV: ${{ inputs.build-env }}
      run: |
        # KEY=VALUE per line, KEY a valid shell identifier
        echo "$BUILD_ENV" | while IFS= read -r line; do
          [ -z "$line" ] && continue
          if ! echo "$line" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*='; then
            echo "::error::Invalid build-env line (expected KEY=VALUE): $line"
            exit 1
          fi
          echo "$line" >> "$GITHUB_ENV"
        done

    - name: '🔨 Build App'
      id: build
      shell: sh
      env:
        BUILD_ARGS: ${{ inputs.build-args }}
        POOL_CACHE_BASE_URL: ${{ inputs.pool-cache-base-url }}
      run: |
        if [ -n "$POOL_CACHE_BASE_URL" ]; then
          export VITE_POOL_CACHE_BASE_URL="$POOL_CACHE_BASE_URL"
        fi
        pnpm build $BUILD_ARGS

    - name: '📦 Upload Build Artifact'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.app-name }}-build-${{ github.sha }}
        path: ./dist

    - name: '📦 Create Release Bundle'
      if: ${{ github.event.action == 'prereleased' }}
      shell: sh
      env:
        ARTIFACT_NAME: ${{ steps.check-artifact.outputs.artifact-name }}
      run: |
        cd dist && zip -r "../$ARTIFACT_NAME" . && cd ..

    # Before the upload: if attestation is unsupported for this repo the job
    # fails here, not after the bundle is already published on the release.
    - name: '🔏 Attest Release Bundle Provenance'
      if: ${{ github.event.action == 'prereleased' && inputs.attest == 'true' }}
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ steps.check-artifact.outputs.artifact-name }}

    - name: '📦 Upload Build Artifact to Release'
      if: ${{ github.event.action == 'prereleased' }}
      shell: sh
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REF_NAME: ${{ github.ref_name }}
        GH_REPOSITORY: ${{ github.repository }}
        ARTIFACT_NAME: ${{ steps.check-artifact.outputs.artifact-name }}
      run: gh release upload "$GH_REF_NAME" "$ARTIFACT_NAME" --repo "$GH_REPOSITORY"
